# Boards to poll. One entry per company.
#
#   ats:   greenhouse | lever | ashby
#   slug:  the company's board identifier (NOT its domain)
#   name:  whatever you want to see in the digest
#
# The slug is the last path segment of the company's public careers board:
#   https://boards.greenhouse.io/<slug>        -> ats: greenhouse
#   https://jobs.lever.co/<slug>               -> ats: lever
#   https://jobs.ashbyhq.com/<slug>            -> ats: ashby
#
# There is no single public API that lists every company's jobs. LinkedIn,
# Naukri, Indeed and Google Jobs do not offer an unauthenticated listing API
# (scraping them violates their ToS). This file is the source of truth: we
# poll each company's documented ATS endpoint instead.
#
# Verify a slug in the browser:
#   https://boards-api.greenhouse.io/v1/boards/<slug>/jobs?content=true
#   https://api.lever.co/v0/postings/<slug>?mode=json
#   https://api.ashbyhq.com/posting-api/job-board/<slug>?includeCompensation=true
#
# A dead slug is not fatal: fetch_board prints the HTTP status and returns [],
# so one bad entry never takes down the run. Watch the per-board job counts on
# stdout — a board reporting 0 jobs every day is a slug that needs fixing.
#
# Location/title filters in config.yaml still drop most of these before any
# LLM call. Add/remove companies you would actually join.

companies:
